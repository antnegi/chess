<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chess Coach</title>
  
  <!-- Chess King Tab Favicon (Inline SVG Data URI) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 45 45'%3E%3Cg fill='%23ffffff' stroke='%23111111' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22.5 4v7M20 7.5h5' stroke-width='2' stroke='%23ffffff'/%3E%3Cpath d='M22.5 4v7M20 7.5h5' stroke-width='1.5' stroke='%23111111'/%3E%3Cpath d='M22.5 11c3.5 0 6.5 2 6.5 6 0 2.5-1.5 4.5-3 5.5 3.5 1.5 5.5 4.5 5.5 8.5 0 2.5-1 4-1 4H14.5s-1-1.5-1-4c0-4 2-7 5.5-8.5-1.5-1-3-3-3-5.5 0-4 3-6 6.5-6z'/%3E%3Cpath d='M11.5 37c5.5 3.5 15.5 3.5 21 0v2H11.5v-2z'/%3E%3Cpath d='M11.5 39c5.5 3.5 15.5 3.5 21 0v2.5H11.5V39z'/%3E%3C/g%3E%3C/svg%3E">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    :root {
      --board-size: min(440px, 92vw);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      padding: 16px 12px 0 12px; 
      background: #181818; 
      color: #fff; 
    }

    #app-container {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      flex: 1;
      justify-content: center;
      align-items: flex-start;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    
    #board-container {
      position: relative;
      width: var(--board-size);
      height: var(--board-size);
      flex-shrink: 0;
      margin: 0 auto;
      touch-action: manipulation;
    }

    #board { 
      width: var(--board-size); 
      height: var(--board-size); 
    }
    
    #arrow-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    .highlight-selected {
      box-shadow: inset 0 0 4px 3px #f6e05e !important;
    }

    .move-dot {
      position: absolute;
      width: 32%;
      height: 32%;
      max-width: 22px;
      max-height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.45);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      cursor: pointer;
      z-index: 50;
      transition: transform 0.1s ease, background 0.1s ease;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.4);
    }
    .move-dot:hover {
      transform: translate(-50%, -50%) scale(1.25);
      background: rgba(255, 255, 255, 0.7);
    }

    .move-dot.best-move-dot {
      background: rgba(34, 197, 94, 0.85) !important;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.8) !important;
    }
    .move-dot.best-move-dot:hover {
      background: rgba(34, 197, 94, 1) !important;
      transform: translate(-50%, -50%) scale(1.3);
    }

    #panel, #notation-panel { 
      width: 320px; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      flex-shrink: 0;
      background: #222;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .control-row { display: flex; gap: 8px; align-items: center; }
    label { font-size: 13px; font-weight: bold; color: #bbb; }
    select { padding: 8px 10px; background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 4px; flex: 1; font-size: 13px; }
    
    .btn { 
      padding: 10px; 
      font-weight: bold; 
      cursor: pointer; 
      border-radius: 5px; 
      border: none; 
      background: #2563eb; 
      color: white; 
      font-size: 13px;
      transition: background 0.15s ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #475569; }
    .btn-undo { background: #d97706; color: white; }
    .btn-reset { background: #dc2626; }
    
    #log { 
      background: #111; 
      padding: 10px; 
      height: 155px; 
      overflow-y: auto; 
      border: 1px solid #333; 
      font-family: monospace; 
      font-size: 12px; 
      line-height: 1.4; 
      border-radius: 4px; 
    }
    #eval { font-size: 1.1em; font-weight: bold; }

    .history-card {
      background: #181818;
      border: 1px solid #333;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      height: 155px;
    }
    .history-header {
      padding: 6px 10px;
      background: #282828;
      font-size: 12px;
      font-weight: bold;
      border-bottom: 1px solid #333;
      display: grid;
      grid-template-columns: 35px 1fr 1fr;
    }
    #move-history {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px;
      font-family: monospace;
      font-size: 13px;
    }
    .move-row {
      display: grid;
      grid-template-columns: 35px 1fr 1fr;
      padding: 3px 0;
      border-bottom: 1px solid #222;
    }
    .move-row:last-child { border-bottom: none; }
    .move-num { color: #777; }
    .move-ply { 
      cursor: pointer; 
      padding: 2px 4px;
      border-radius: 3px;
      user-select: none;
    }
    .move-ply:hover { 
      background: #333;
      color: #60a5fa; 
    }
    .move-ply.active-ply {
      background: #2563eb;
      color: #fff;
      font-weight: bold;
    }

    .io-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    textarea {
      width: 100%;
      height: 55px;
      background: #111;
      border: 1px solid #333;
      color: #ddd;
      font-family: monospace;
      font-size: 11px;
      padding: 6px;
      border-radius: 4px;
      resize: none;
    }
    .io-btn-row {
      display: flex;
      gap: 6px;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 14px 0;
      margin-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 11px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #777;
      text-align: center;
    }
    footer span.author {
      color: #ccc;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Responsive adjustments for phones and tablets */
    @media (max-width: 1080px) {
      #app-container {
        flex-direction: column;
        align-items: center;
      }
      #panel, #notation-panel {
        width: var(--board-size);
      }
    }
  </style>
</head>
<body>

  <div id="app-container">
    <div id="board-container">
      <div id="board"></div>
      <svg id="arrow-overlay">
        <defs>
          <marker id="arrowhead-green" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
            <path d="M 0 0.5 L 6 3 L 0 5.5 z" fill="rgba(34, 197, 94, 0.75)" />
          </marker>
          <marker id="arrowhead-red" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
            <path d="M 0 0.5 L 6 3 L 0 5.5 z" fill="rgba(239, 68, 68, 0.8)" />
          </marker>
        </defs>
        <g id="arrow-group"></g>
      </svg>
    </div>

    <div id="panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 id="turn" style="margin: 0; font-size: 15px;">White to move</h3>
        <div id="eval">0.00</div>
      </div>

      <div class="control-row">
        <label for="sideSelect">Analyze:</label>
        <select id="sideSelect">
          <option value="auto">Current Turn</option>
          <option value="w">White</option>
          <option value="b">Black</option>
        </select>
        <button class="btn btn-secondary" onclick="flipOrientation()">Flip</button>
      </div>

      <div class="control-row">
        <button class="btn btn-undo" style="flex: 1;" onclick="undoMove()">⬅ Undo</button>
        <button class="btn btn-reset" style="flex: 1;" onclick="resetBoard()">Reset</button>
      </div>

      <button class="btn" style="background: #b91c1c;" onclick="getThreat()">1. Threat Alert</button>
      <button class="btn" onclick="getBestMove()">2. Best Move</button>
      <div id="log">Engine ready. Tap or drag a piece to start!</div>
    </div>

    <div id="notation-panel">
      <label>Move History (Tap move to jump):</label>
      <div class="history-card">
        <div class="history-header">
          <span>#</span>
          <span>White</span>
          <span>Black</span>
        </div>
        <div id="move-history"></div>
      </div>

      <div class="io-container">
        <label for="pgnInput">Paste PGN / FEN to Analyze:</label>
        <textarea id="pgnInput" placeholder="Paste PGN or FEN string here"></textarea>
        <div class="io-btn-row">
          <button class="btn" style="flex: 1; background: #166534;" onclick="loadPgnOrFen()">Load</button>
          <button class="btn btn-secondary" style="flex: 1;" onclick="copyCurrentPgn()">Copy PGN</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <span>Designed &amp; Developed by</span>
    <span class="author">Antriksh Singh Negi</span>
  </footer>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    const fullGame = new Chess();
    const game = new Chess();
    let currentPlyIndex = 0; 
    let initialFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';

    const logBox = document.getElementById('log');
    let stockfish;
    let pendingAction = null;
    let targetSide = 'w';
    let activeArrows = [];

    let selectedSquare = null;
    let cachedBestMove = null;

    function log(msg) {
      logBox.innerHTML += `<div>${msg}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    function updateTurnLabel() {
      document.getElementById('turn').innerText = game.turn() === 'w' ? 'White to move' : 'Black to move';
    }

    function requestEvaluation() {
      stockfish.postMessage(`position fen ${game.fen()}`);
      stockfish.postMessage('go depth 12');
    }

    function getFenForSide(desiredSide) {
      const tokens = game.fen().split(' ');
      if (desiredSide !== 'auto') {
        tokens[1] = desiredSide;
      }
      return tokens.join(' ');
    }

    function syncBoardToPly(targetPly) {
      clearArrows();
      clearDots();
      const moves = fullGame.history({ verbose: true });
      
      game.load(initialFen);
      for (let i = 0; i < targetPly && i < moves.length; i++) {
        game.move(moves[i]);
      }
      
      currentPlyIndex = targetPly;
      board.position(game.fen());
      updateTurnLabel();
      renderMoveHistory();
      requestEvaluation();
    }

    function renderMoveHistory() {
      const history = fullGame.history();
      const container = document.getElementById('move-history');
      container.innerHTML = '';

      for (let i = 0; i < history.length; i += 2) {
        const moveNumber = Math.floor(i / 2) + 1;
        const whitePly = i + 1;
        const blackPly = i + 2;

        const row = document.createElement('div');
        row.className = 'move-row';

        const numSpan = document.createElement('span');
        numSpan.className = 'move-num';
        numSpan.innerText = `${moveNumber}.`;
        row.appendChild(numSpan);

        const whiteSpan = document.createElement('span');
        whiteSpan.className = 'move-ply' + (currentPlyIndex === whitePly ? ' active-ply' : '');
        whiteSpan.innerText = history[i];
        whiteSpan.onclick = () => syncBoardToPly(whitePly);
        row.appendChild(whiteSpan);

        const blackSpan = document.createElement('span');
        blackSpan.className = 'move-ply' + (currentPlyIndex === blackPly ? ' active-ply' : '');
        blackSpan.innerText = history[i + 1] || '';
        if (history[i + 1]) {
          blackSpan.onclick = () => syncBoardToPly(blackPly);
        }
        row.appendChild(blackSpan);

        container.appendChild(row);
      }

      const activeEl = container.querySelector('.active-ply');
      if (activeEl) {
        activeEl.scrollIntoView({ block: 'nearest' });
      }
    }

    function loadPgnOrFen() {
      const input = document.getElementById('pgnInput').value.trim();
      if (!input) return;

      clearArrows();
      clearDots();
      const fenTokens = input.split(/\s+/);
      const isFen = fenTokens.length >= 2 && fenTokens[0].includes('/');

      if (isFen) {
        if (fullGame.load(input)) {
          initialFen = input;
          syncBoardToPly(0);
          log("Loaded position from FEN.");
        } else {
          log("<span style='color:#f87171;'>Error: Invalid FEN string!</span>");
        }
      } else {
        const temp = new Chess();
        if (temp.load_pgn(input)) {
          initialFen = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
          fullGame.load_pgn(input);
          syncBoardToPly(fullGame.history().length);
          log("Loaded game from PGN.");
        } else {
          log("<span style='color:#f87171;'>Error: Invalid PGN format!</span>");
        }
      }
    }

    function copyCurrentPgn() {
      const pgn = fullGame.pgn();
      if (!pgn) {
        log("No moves to export yet.");
        return;
      }
      navigator.clipboard.writeText(pgn).then(() => {
        log("Copied full PGN to clipboard!");
      });
    }

    // Dynamic Board Coordinate Calculations based on actual rendered width
    function getBoardPixelSize() {
      return document.getElementById('board').getBoundingClientRect().width;
    }

    function squareToCoords(square, orientation) {
      const file = square.charCodeAt(0) - 97;
      const rank = parseInt(square[1]) - 1;
      const boardWidth = getBoardPixelSize();
      const sqSize = boardWidth / 8;

      let col = orientation === 'white' ? file : 7 - file;
      let row = orientation === 'white' ? 7 - rank : rank;

      return {
        x: col * sqSize + sqSize / 2,
        y: row * sqSize + sqSize / 2
      };
    }

    function addArrow(fromSq, toSq, colorType) {
      const orientation = board.orientation();
      const p1 = squareToCoords(fromSq, orientation);
      const p2 = squareToCoords(toSq, orientation);

      const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      const boardWidth = getBoardPixelSize();
      const headOffset = (boardWidth / 440) * 10; 
      const targetX = p2.x - Math.cos(angle) * headOffset;
      const targetY = p2.y - Math.sin(angle) * headOffset;

      const group = document.getElementById('arrow-group');
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', p1.x);
      line.setAttribute('y1', p1.y);
      line.setAttribute('x2', targetX);
      line.setAttribute('y2', targetY);
      
      const strokeColor = colorType === 'red' ? 'rgba(239, 68, 68, 0.8)' : 'rgba(34, 197, 94, 0.75)';
      const markerId = colorType === 'red' ? 'url(#arrowhead-red)' : 'url(#arrowhead-green)';

      line.setAttribute('stroke', strokeColor);
      line.setAttribute('stroke-width', Math.max(3.5, (boardWidth / 440) * 5.5));
      line.setAttribute('stroke-linecap', 'round');
      line.setAttribute('marker-end', markerId);

      group.appendChild(line);
      activeArrows.push({ from: fromSq, to: toSq, color: colorType });
    }

    function redrawArrows() {
      const saved = [...activeArrows];
      document.getElementById('arrow-group').innerHTML = '';
      activeArrows = [];
      saved.forEach(a => addArrow(a.from, a.to, a.color));
    }

    function clearArrows() {
      activeArrows = [];
      document.getElementById('arrow-group').innerHTML = '';
    }

    function clearDots() {
      selectedSquare = null;
      $('#board .square-55d63').removeClass('highlight-selected');
      $('#board .move-dot').remove();
    }

    function showMoveDots(square) {
      clearDots();
      selectedSquare = square;
      
      const $fromSquare =$(`#board .square-${square}`);
      $fromSquare.addClass('highlight-selected');

      const legalMoves = game.moves({ square: square, verbose: true });
      if (legalMoves.length === 0) return;

      legalMoves.forEach(m => {
        const $targetSquare =$(`#board .square-${m.to}`);
        const $dot =$('<div class="move-dot"></div>');

        if (cachedBestMove && cachedBestMove.from === square && cachedBestMove.to === m.to) {
          $dot.addClass('best-move-dot');
        }

        $dot.on('click touchend', function(e) {
          e.preventDefault();
          e.stopPropagation();
          executeMove(square, m.to);
        });

        $targetSquare.append($dot);
      });
    }

    function executeMove(source, target) {
      const move = game.move({ from: source, to: target, promotion: 'q' });
      if (move === null) return 'snapback';

      const moves = fullGame.history({ verbose: true });
      fullGame.load(initialFen);
      for (let i = 0; i < currentPlyIndex; i++) {
        fullGame.move(moves[i]);
      }
      fullGame.move(move);
      currentPlyIndex++;

      clearArrows();
      clearDots();
      renderMoveHistory();
      updateTurnLabel();
      board.position(game.fen());
      requestEvaluation();
    }

    $('#board').on('click touchend', '.square-55d63', function(e) {
      if ($(e.target).hasClass('move-dot')) return;

      const square = $(this).attr('data-square');
      if (!square) return;

      const piece = game.get(square);

      if (piece && piece.color === game.turn()) {
        showMoveDots(square);
      } else if (selectedSquare) {
        clearDots();
      }
    });

    function detectDirectThreats(defenderColor) {
      const attackerColor = defenderColor === 'w' ? 'b' : 'w';
      const tempGame = new Chess(getFenForSide(attackerColor));
      const legalMoves = tempGame.moves({ verbose: true });
      
      const threats = [];
      for (const m of legalMoves) {
        if (m.captured) {
          threats.push({ from: m.from, to: m.to, captured: m.captured, piece: m.piece });
        }
      }
      return threats;
    }

    const workerScript = `importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.0/stockfish.js');`;
    const blob = new Blob([workerScript], { type: 'application/javascript' });
    stockfish = new Worker(URL.createObjectURL(blob));

    stockfish.postMessage('uci');

    stockfish.onmessage = function(event) {
      const line = event.data;
      if (typeof line !== 'string') return;

      if (line.includes('score cp')) {
        const match = line.match(/score cp (-?\d+)/);
        if (match) {
          let cp = parseInt(match[1]) / 100;
          if (game.turn() === 'b') cp = -cp;
          document.getElementById('eval').innerText = `${cp > 0 ? '+' : ''}${cp.toFixed(2)}`;
        }
      }

      if (line.includes('bestmove')) {
        const parts = line.split(' ');
        const move = parts[1];
        const sideName = targetSide === 'w' ? 'White' : 'Black';

        if (move && move.length >= 4 && move !== '(none)') {
          cachedBestMove = { from: move.substring(0, 2), to: move.substring(2, 4) };
        }

        if (pendingAction === 'best') {
          clearArrows();
          log(`<b>[Best Move for ${sideName}]:</b> ${move}`);
          if (cachedBestMove) {
            addArrow(cachedBestMove.from, cachedBestMove.to, 'green');
            if (selectedSquare === cachedBestMove.from) {
              $(`#board .square-${cachedBestMove.to} .move-dot`).addClass('best-move-dot');
            }
          }
          pendingAction = null;
        } else if (pendingAction === 'threat') {
          clearArrows();
          const threats = detectDirectThreats(targetSide);
          if (threats.length > 0) {
            log(`<b>[Direct Attacks]:</b>`);
            threats.forEach(t => {
              addArrow(t.from, t.to, 'red');
              log(`&bull; ${t.piece.toUpperCase()} ${t.from} &rarr; ${t.to}`);
            });
          }

          if (move && move.length >= 4 && move !== '(none)') {
            const oppBestFrom = move.substring(0, 2);
            const oppBestTo = move.substring(2, 4);
            const exists = threats.some(t => t.from === oppBestFrom && t.to === oppBestTo);
            if (!exists) {
              addArrow(oppBestFrom, oppBestTo, 'red');
            }
            log(`<b>[Top Opponent Threat]:</b> ${move}`);
          }
          pendingAction = null;
        }
      }
    };

    const board = Chessboard('board', {
      draggable: true,
      position: 'start',
      orientation: 'white',
      pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
      onDragStart: (source, piece) => {
        if (game.game_over()) return false;
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }
        showMoveDots(source);
      },
      onDrop: (source, target) => {
        return executeMove(source, target);
      },
      onSnapEnd: () => {
        board.position(game.fen());
      }
    });

    // Handle fluid window resizing
    window.addEventListener('resize', () => {
      board.resize();
      redrawArrows();
      if (selectedSquare) {
        showMoveDots(selectedSquare);
      }
    });

    function undoMove() {
      if (currentPlyIndex === 0) {
        log("<i>At starting position.</i>");
        return;
      }
      syncBoardToPly(currentPlyIndex - 1);
    }

    function flipOrientation() {
      board.flip();
      const currentOrientation = board.orientation();
      document.getElementById('sideSelect').value = currentOrientation === 'black' ? 'b' : 'w';
      redrawArrows();
      if (selectedSquare) {
        showMoveDots(selectedSquare);
      }
    }

    function getBestMove() {
      const selected = document.getElementById('sideSelect').value;
      targetSide = selected === 'auto' ? game.turn() : selected;
      const fen = getFenForSide(targetSide);

      pendingAction = 'best';
      stockfish.postMessage(`position fen ${fen}`);
      stockfish.postMessage('go depth 12');
    }

    function getThreat() {
      const selected = document.getElementById('sideSelect').value;
      const defender = selected === 'auto' ? game.turn() : selected;
      targetSide = defender;
      
      const attacker = defender === 'w' ? 'b' : 'w';
      const fen = getFenForSide(attacker);

      pendingAction = 'threat';
      stockfish.postMessage(`position fen ${fen}`);
      stockfish.postMessage('go depth 10');
    }

    function resetBoard() {
      clearArrows();
      clearDots();
      cachedBestMove = null;
